[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lcfa"
version = "0.1.0a0"
description = "Domain-neutral state reasoning and governed action propagation runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Beag Labs" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "blake3>=1.0",
  "numpy>=1.26",
  "safetensors>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
transformers = [
  "transformers>=5.17,<6",
  "torch>=2.6",
  "accelerate>=1.14",
]
rwkv = [
  "transformers>=5.17,<6",
  "torch>=2.6",
  "accelerate>=1.14",
]
mlx = [
  "mlx>=0.32.2",
  "mlx-lm>=0.31.3",
]
llama-cpp = [
  "llama-cpp-python>=0.3",
]
mac = [
  "mlx>=0.32.2",
  "mlx-lm>=0.31.3",
]
benchmarks = [
  "datasets>=3.0",
  "huggingface-hub>=0.30",
]
memory = [
  "faiss-cpu>=1.8",
]

[project.scripts]
lcfa-bench = "lcfa.bench_cli:main"
lcfa-bench-mixed = "lcfa.bench_mixed_cli:main"
lcfa-bench-suite = "lcfa.bench_suite_cli:main"
lcfa-bench-card = "lcfa.bench_card:main"
lcfa-latent = "lcfa.latent_cli:main"
lcfa-semantic = "lcfa.semantic_cli:main"
lcfa-recurrent = "lcfa.recurrent_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/lcfa"]
