name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - name: Benchmark reference safetensors artifact
        run: |
          lcfa-bench run builtin:all \
            --artifact artifacts/lcfa-weighted-identity \
            --name lcfa-weighted-identity \
            --repeats 3 \
            -o weighted-report.json
          python - <<'PY'
          import json
          report = json.load(open("weighted-report.json", encoding="utf-8"))
          summary = report["summary"]
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary["case_count"] == 17
          assert summary["case_pass_rate"] == 1.0
          assert summary["assertion_accuracy"] == 1.0
          assert summary["error_rate"] == 0.0
          assert summary["replay_determinism_rate"] == 1.0
          assert summary["evidence_f1"] == 1.0
          PY
