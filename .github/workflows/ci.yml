name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Smoke-check installed CLIs
        run: |
          lcfa-bench --help >/dev/null
          lcfa-bench-mixed --help >/dev/null
          lcfa-bench-suite --help >/dev/null
          lcfa-bench-card --help >/dev/null
          lcfa-latent --help >/dev/null
          lcfa-bench-suite list >/dev/null
          printf 'LCFA latent training example\n' > /tmp/lcfa-corpus.txt
          lcfa-latent prepare /tmp/lcfa-corpus.txt --mask-ratio 0.25 --seed 7 -o /tmp/lcfa-latent.jsonl
          test -s /tmp/lcfa-latent.jsonl
      - run: pytest
      - name: Benchmark reference safetensors artifact
        run: |
          lcfa-bench run builtin:all \
            --artifact artifacts/lcfa-weighted-identity \
            --name lcfa-weighted-identity \
            --repeats 3 \
            -o weighted-report.json
          python - <<'PY'
          import json
          summary = json.load(open("weighted-report.json", encoding="utf-8"))["summary"]
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary["case_count"] == 17
          assert summary["case_pass_rate"] == 1.0
          assert summary["assertion_accuracy"] == 1.0
          assert summary["error_rate"] == 0.0
          assert summary["replay_determinism_rate"] == 1.0
          assert summary["evidence_f1"] == 1.0
          PY
      - name: Benchmark reference stochastic-flow artifact
        run: |
          lcfa-bench run builtin:all \
            --artifact artifacts/lcfa-stochastic-flow-reference \
            --name lcfa-stochastic-flow-reference \
            --repeats 2 \
            -o stochastic-report.json
          python - <<'PY'
          import json
          summary = json.load(open("stochastic-report.json", encoding="utf-8"))["summary"]
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary["case_count"] == 17
          assert summary["case_pass_rate"] == 1.0
          assert summary["assertion_accuracy"] == 1.0
          assert summary["error_rate"] == 0.0
          assert summary["replay_determinism_rate"] == 1.0
          assert summary["evidence_f1"] == 1.0
          PY
      - name: Benchmark reference latent-flow artifact
        run: |
          lcfa-bench run builtin:all \
            --artifact artifacts/lcfa-latent-flow-reference \
            --name lcfa-latent-flow-reference \
            --repeats 2 \
            -o latent-report.json
          python - <<'PY'
          import json
          report = json.load(open("latent-report.json", encoding="utf-8"))
          summary = report["summary"]
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary["case_count"] == 17
          assert summary["case_pass_rate"] == 1.0
          assert summary["assertion_accuracy"] == 1.0
          assert summary["error_rate"] == 0.0
          assert summary["replay_determinism_rate"] == 1.0
          assert summary["evidence_f1"] == 1.0
          assert report["subject_metadata"]["architecture"] == "lcfa.latent-flow.v1"
          PY
